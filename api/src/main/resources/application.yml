server:
  port: 8080
spring:
  application:
    name: ops-platform-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ops_platform}
    username: ${DB_USERNAME:ops}
    password: ${DB_PASSWORD:ops_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jackson:
    time-zone: Asia/Shanghai
